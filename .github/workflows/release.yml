name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0"
        required: true

permissions:
  contents: write

env:
  BIN: clipd
  CARGO_TERM_COLOR: always

jobs:
  build:
    # macOS only: the artifact is macOS-specific and lipo is needed for the universal binary.
    runs-on: macos-14
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      asset: ${{ steps.package.outputs.asset }}
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and verify version
        id: meta
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          version="${tag#v}"
          cargo_version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$cargo_version" != "$version" ]; then
            echo "::error::Cargo.toml says $cargo_version but the tag is $tag"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build both architectures
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin

      - name: Merge into a universal binary and package
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          name="$BIN-$version-macos-universal"

          mkdir -p "pkg/$name"
          lipo -create -output "pkg/$name/$BIN" \
            "target/aarch64-apple-darwin/release/$BIN" \
            "target/x86_64-apple-darwin/release/$BIN"
          lipo -info "pkg/$name/$BIN"
          cp README.md LICENSE "pkg/$name/"

          tar -C pkg -czf "$name.tar.gz" "$name"
          sha=$(shasum -a 256 "$name.tar.gz" | cut -d' ' -f1)
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

          echo "asset=$name.tar.gz" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha"        >> "$GITHUB_OUTPUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.meta.outputs.tag }}"
          asset="${{ steps.package.outputs.asset }}"
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            "$asset" "$asset.sha256" \
            || gh release upload "$tag" "$asset" "$asset.sha256" --clobber

  tap:
    needs: build
    runs-on: ubuntu-latest
    # Leave the tap alone for prereleases such as v0.2.0-rc1.
    if: ${{ !contains(needs.build.outputs.tag, '-') }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: wesleyel/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Render the formula
        run: |
          set -euo pipefail
          mkdir -p tap/Formula
          sed \
            -e "s|@VERSION@|${{ needs.build.outputs.version }}|g" \
            -e "s|@SHA256@|${{ needs.build.outputs.sha256 }}|g" \
            packaging/homebrew/clipd.rb.tmpl \
            > tap/Formula/clipd.rb
          cat tap/Formula/clipd.rb

      - name: Commit
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/clipd.rb
          if git diff --cached --quiet; then
            echo "formula unchanged, nothing to do"
            exit 0
          fi
          git commit -m "clipd ${{ needs.build.outputs.version }}"
          git push
